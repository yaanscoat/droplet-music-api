<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07060b">
  <title>Droplet</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- The lava lamp behind everything. Colours follow the cover art of whatever is playing. -->
  <div class="ambient" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="grain"></div>
  </div>

  <!-- Liquid glass refraction filters are generated into here by js/glass.js (Chromium only). -->
  <svg class="glass-defs" width="0" height="0" aria-hidden="true"><defs id="glass-defs"></defs></svg>

  <div class="app" id="app">
    <!-- ── Sidebar ───────────────────────────────────────── -->
    <nav class="sidebar lg" data-refract="28" aria-label="Main">
      <a class="brand" href="#/" aria-label="Droplet home">
        <img src="assets/logo.svg" alt="" width="34" height="34">
        <span class="brand-name">Droplet</span>
      </a>

      <div class="nav-group">
        <a class="nav-link" href="#/" data-nav="home"><span class="nav-ico" data-icon="home"></span><span>Home</span></a>
        <a class="nav-link" href="#/search" data-nav="search"><span class="nav-ico" data-icon="search"></span><span>Search</span></a>
        <a class="nav-link" href="#/liked" data-nav="liked"><span class="nav-ico" data-icon="library"></span><span>Library</span></a>
        <span class="nav-indicator" aria-hidden="true"></span>
      </div>

      <div class="sidebar-section">
        <span class="sidebar-label">Your stuff</span>
        <a class="liked-tile" href="#/liked">
          <span class="liked-tile-art" data-icon="heart-fill"></span>
          <span class="liked-tile-text">
            <strong>Liked songs</strong>
            <small id="liked-count">0 songs</small>
          </span>
        </a>
        <div class="recent-list" id="recent-list"></div>
      </div>

      <div class="sidebar-foot">
        <span class="source-dot" id="source-pill"></span>
      </div>
    </nav>

    <!-- ── Main column ───────────────────────────────────── -->
    <div class="main-col">
      <header class="topbar">
        <form class="search lg" data-refract="18" id="search-form" role="search" autocomplete="off">
          <span class="search-icon" data-icon="search"></span>
          <input id="search-input" type="search" placeholder="What do you want to hear?" aria-label="Search" spellcheck="false">
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
          <button type="button" class="icon-btn search-clear" id="search-clear" aria-label="Clear search" hidden data-icon="close"></button>
          <ul class="suggest" id="suggest" role="listbox" hidden></ul>
        </form>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <!-- ── Now playing (full screen) ─────────────────────── -->
    <section class="now-playing" id="now-playing" aria-label="Now playing" hidden>
      <div class="np-backdrop" id="np-backdrop"></div>
      <button class="icon-btn np-close lg-lite" id="np-close" aria-label="Close now playing" data-icon="collapse"></button>
      <div class="np-inner">
        <div class="np-stage">
          <div class="np-art-wrap" id="np-art-wrap">
            <img class="np-art" id="np-art" alt="">
          </div>
          <div class="np-meta">
            <h2 id="np-title">Nothing playing</h2>
            <p id="np-artist"></p>
            <p class="np-source" id="np-source"></p>
          </div>
          <canvas class="np-viz" id="np-viz" width="560" height="72" aria-hidden="true"></canvas>
        </div>
        <aside class="np-queue lg" data-refract="30">
          <div class="np-tabs"><span class="np-tab active">Up next</span></div>
          <div class="np-queue-list" id="np-queue"></div>
        </aside>
      </div>
    </section>

    <!-- ── Player ────────────────────────────────────────── -->
    <footer class="player lg" data-refract="30" id="player" data-state="idle">
      <div class="player-track">
        <button class="player-art-btn" id="btn-art" aria-label="Open now playing">
          <img class="player-art" id="player-art" alt="">
          <span class="player-art-hint" data-icon="expand"></span>
        </button>
        <div class="player-text">
          <div class="player-title" id="player-title">Nothing playing yet</div>
          <div class="player-artist" id="player-artist">Pick a song, any song</div>
        </div>
        <button class="icon-btn like-btn" id="btn-like" aria-label="Like" data-icon="heart" disabled></button>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button class="icon-btn sm" id="btn-shuffle" aria-label="Shuffle" data-icon="shuffle"></button>
          <button class="icon-btn" id="btn-prev" aria-label="Previous" data-icon="prev"></button>
          <button class="play-btn" id="btn-play" aria-label="Play" data-icon="play"></button>
          <button class="icon-btn" id="btn-next" aria-label="Next" data-icon="next"></button>
          <button class="icon-btn sm" id="btn-repeat" aria-label="Repeat" data-icon="repeat"></button>
        </div>
        <div class="progress-row">
          <span class="time" id="time-cur">0:00</span>
          <div class="progress" id="progress" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="progress-track">
              <div class="progress-buffer" id="progress-buffer"></div>
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-thumb" id="progress-thumb"></div>
            <div class="progress-tip" id="progress-tip">0:00</div>
          </div>
          <span class="time" id="time-dur">0:00</span>
        </div>
      </div>

      <div class="player-extra">
        <button class="icon-btn" id="btn-download" aria-label="Download" title="Download" data-icon="download" disabled></button>
        <button class="icon-btn" id="btn-more" aria-label="More options" data-icon="more" disabled></button>
        <button class="icon-btn" id="btn-expand" aria-label="Queue and now playing" title="Now playing" data-icon="queue"></button>
        <div class="volume">
          <button class="icon-btn" id="btn-mute" aria-label="Mute" data-icon="volume"></button>
          <div class="volume-slider">
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
          </div>
        </div>
      </div>
    </footer>

    <!-- ── Mobile tab bar ────────────────────────────────── -->
    <nav class="tabbar lg" data-refract="20" aria-label="Main">
      <a href="#/" data-nav="home"><span data-icon="home"></span><span>Home</span></a>
      <a href="#/search" data-nav="search"><span data-icon="search"></span><span>Search</span></a>
      <a href="#/liked" data-nav="liked"><span data-icon="library"></span><span>Library</span></a>
    </nav>
  </div>

  <div class="menu lg" data-refract="22" id="menu" role="menu" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <audio id="audio" preload="auto"></audio>
</body>
</html>
